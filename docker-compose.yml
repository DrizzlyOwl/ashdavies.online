services:
  redis:
    image: redis:8.12.0-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    restart: always
    networks:
     - ashdavies
  mailhog:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: always
    ports:
      - 8025:8025
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - ashdavies
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache@sha256:64293e1f91d6509e9530d51059b1d45a31d3e4b38ead27cc9648b915b061ba2c
    restart: always
    ports:
      - 8880:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
    networks:
      - ashdavies
  wordpress:
    build:
      context: .
    restart: always
    ports:
      - 8080:80
    env_file:
      - .env.wordpress
    volumes:
      - ./app/uploads/:/usr/src/wordpress/wp-content/uploads/
      - ./app/languages/:/usr/src/wordpress/wp-content/languages/
      - ./app/themes/:/usr/src/wordpress/wp-content/themes/
      - ./app/plugins/:/usr/src/wordpress/wp-content/plugins/
      - ./app/mu-plugins/:/usr/src/wordpress/wp-content/mu-plugins/
      - ./app/object-cache.php:/usr/src/wordpress/wp-content/object-cache.php
    networks:
      - ashdavies
  mysql:
    platform: linux/amd64
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    env_file:
      - .env.mysql
    ports:
      - 3306:3306
    restart: unless-stopped
    volumes:
      - db:/var/lib/mysql
    networks:
      - ashdavies

networks:
  ashdavies:

volumes:
  db:
